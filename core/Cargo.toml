[package]
name = "agentz-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# staticlib: linked into the macOS app in ../macos. lib: for `cargo test`.
crate-type = ["staticlib", "lib"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uniffi = "0.32.2"
uuid = { version = "1.26.1", features = ["v4"] }

# bindgen/ generates the Swift side. `cargo test` and `cargo clippy` here
# cover only the core; build-core.sh builds the bindgen tool when it runs it.
[workspace]
members = [".", "bindgen"]
default-members = ["."]
